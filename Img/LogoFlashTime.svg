 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7C2"/><stop offset="0.7" stop-color="#FFC98C"/><stop offset="1" stop-color="#FFB070"/></linearGradient>
